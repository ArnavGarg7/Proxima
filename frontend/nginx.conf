server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend on the compose network. Keeping the API
    # same-origin with the SPA means auth cookies are first-party (so Secure +
    # SameSite=strict work) and no CORS round-trips are needed.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events (/api/intelligence/complete): stream tokens through
        # immediately instead of buffering the whole response.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # SPA routing: serve index.html for client-side routes like /ask, /workspace.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
