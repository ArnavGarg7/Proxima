

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: proxima
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/proxima
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    command: uvicorn proxima.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/proxima
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
      - backend
    # Root-cause fix for the prior exit-137 (OOM): the worker previously ran at
    # Celery's default prefork concurrency (= CPU count, 12 here), so 12 full-app
    # child processes exhausted memory. Bound concurrency and recycle children on
    # task/memory thresholds so a leak or a heavy document can't OOM the host.
    #   --concurrency=2            : 2 prefork children (tasks are I/O-bound on provider calls)
    #   --max-tasks-per-child=100  : recycle a child after 100 tasks (bounds slow growth)
    #   --max-memory-per-child KB  : recycle a child once its RSS exceeds ~350MB
    command: >
      celery -A proxima.celery_app worker --loglevel=info
      --concurrency=2 --max-tasks-per-child=100 --max-memory-per-child=350000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A proxima.celery_app inspect ping -t 10 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    env_file:
      - ./frontend/.env
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  redis_data:
