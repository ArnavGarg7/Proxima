# Production profile. Separate from docker-compose.yml (development).
#
# Run with an explicit project name so it never collides with the dev stack:
#   POSTGRES_PASSWORD=... docker compose -p proxima_prod -f docker-compose.prod.yml up -d --build
#
# Required environment (supplied by the shell or a root .env file — never
# committed): POSTGRES_PASSWORD. Application secrets (SESSION_SECRET, JWT keys,
# provider keys, Google OAuth) come from backend/.env.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-proxima}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-proxima}
    volumes:
      - proxima_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proxima} -d ${POSTGRES_DB:-proxima}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No host port: the database is only reachable inside the compose network.

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - proxima_redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No host port: Redis is only reachable inside the compose network.

  # One-shot migration runner. Backend and worker wait for this to complete, so
  # exactly one process applies migrations (no start-up race) before any code
  # serves traffic against the schema.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: alembic upgrade head
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-proxima}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-proxima}
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn proxima.main:app --host 0.0.0.0 --port 8000
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-proxima}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-proxima}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - STORAGE_PATH=/app/storage
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080}
    env_file:
      - ./backend/.env
    volumes:
      - proxima_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # No host port: the API is reached through the frontend's /api proxy.

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      celery -A proxima.celery_app worker --loglevel=info
      --concurrency=2 --max-tasks-per-child=100 --max-memory-per-child=350000
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-proxima}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-proxima}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - STORAGE_PATH=/app/storage
      - EMBEDDING_RPM=${EMBEDDING_RPM:-90}
    env_file:
      - ./backend/.env
    volumes:
      - proxima_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A proxima.celery_app inspect ping -t 10 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        # Public origin the browser uses to reach the API. Same-origin with the
        # SPA by default (nginx proxies /api to the backend).
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  proxima_pgdata:
  proxima_redisdata:
  proxima_storage:
